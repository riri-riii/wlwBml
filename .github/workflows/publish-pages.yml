name: Publish bookmarklet
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "公開する40桁のコミットSHA。空欄は現在のmain。復旧時は以前のSHA。"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: wlw-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test publication loader
        run: node --test publish/publication.test.mjs
      - name: Build publication
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node publish/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
