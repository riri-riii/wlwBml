<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャスト絞り込み確認</title><body><div id="wlw-role-demo" class="viz-dotted-background">
<style>
#wlw-role-demo{padding:12px;font:14px/1.5 sans-serif}
#wlw-role-demo .sample{color:light-dark(#555,#bbb);margin-bottom:8px}
#wlw-role-demo #wlw_custom{display:none}
#wlw_cast_select_ui{position:relative!important;inset:auto!important;background:transparent!important;padding:0!important}
#wlw_cast_select_ui [role="dialog"]{max-height:none!important;overflow:visible!important}
#wlw_cast_select_ui [role="dialog"] > div{max-height:none!important}
#wlw_cast_select_button{position:static!important;margin-top:8px}
</style>
<div class="sample">サンプルデータ</div>
<div id="wlw_custom">
<div data-wlw-cast-id="0" data-wlw-cast-name="サンドリヨン" data-wlw-rank="36" data-wlw-role="0" data-wlw-wins="264"></div>
<div data-wlw-cast-id="32" data-wlw-cast-name="アシェンプテル" data-wlw-rank="20" data-wlw-role="1" data-wlw-wins="100"></div>
<div data-wlw-cast-id="2" data-wlw-cast-name="ピーター・ザ・キッド" data-wlw-rank="25" data-wlw-role="2" data-wlw-wins="100"></div>
<div data-wlw-cast-id="3" data-wlw-cast-name="アタッカー例・CR19" data-wlw-rank="19" data-wlw-role="1" data-wlw-wins="100"></div>
<div data-wlw-cast-id="4" data-wlw-cast-name="アタッカー例・CR40" data-wlw-rank="40" data-wlw-role="1" data-wlw-wins="100"></div>
</div>
</div>
<script>
/*
 * WLWキャスト表示選択_04
 * キャスト別勝率の表示行を選択する。初期表示はCR1以上のみ。
 */
void (function () {

    if (window.__wlwCastSelectionLoaded) return;
    window.__wlwCastSelectionLoaded = true;

    const BUTTON_ID = "wlw_cast_select_button";
    const UI_ID = "wlw_cast_select_ui";
    let selectedIds = null;
    let selectedRank = "1";
    let selectedRole = "all";

    const observer = new MutationObserver(() => {
        if (mount()) observer.disconnect();
    });
    if (!mount()) observer.observe(document.body, { childList: true, subtree: true });

    function getCasts() {
        return Array.from(document.querySelectorAll("#wlw_custom [data-wlw-cast-id]"), row => {
            const rawRank = row.dataset.wlwRank;
            const rank = rawRank == null || rawRank === "" ? null : Number(rawRank);
            return {
                row,
                id: row.dataset.wlwCastId,
                name: row.dataset.wlwCastName || row.dataset.wlwCastId,
                wins: Number(row.dataset.wlwWins),
                role: /^[012]$/.test(row.dataset.wlwRole || "") ? row.dataset.wlwRole : null,
                rank: Number.isInteger(rank) && rank >= 0 ? rank : null
            };
        });
    }

    function mount() {
        if (document.getElementById(BUTTON_ID)) return true;
        const casts = getCasts();
        if (!casts.length) return false;

        selectedIds = new Set(
            casts.filter(cast => cast.rank !== null && cast.rank >= 1).map(cast => cast.id)
        );
        applySelection(casts);

        document.getElementById("wlw_export_button")?.remove();
        document.getElementById("wlw_export_ui")?.remove();

        const button = makeButton("キャスト選択", true);
        button.id = BUTTON_ID;
        button.setAttribute("aria-haspopup", "dialog");
        button.style.cssText += ";position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483646;box-shadow:0 2px 8px #0003";
        button.addEventListener("click", () => openPanel(button));
        document.getElementById("wlw-role-demo").appendChild(button);
        return true;
    }

    function applySelection(casts) {
        for (const cast of casts) {
            if (selectedIds.has(cast.id)) cast.row.style.removeProperty("display");
            else cast.row.style.setProperty("display", "none", "important");
        }
    }

    function element(tag, text, css) {
        const node = document.createElement(tag);
        if (text != null) node.textContent = text;
        if (css) node.style.cssText = css;
        return node;
    }

    function makeButton(text, primary) {
        const button = element("button", text,
            "padding:8px 10px;min-height:36px;border:1px solid #999;border-radius:6px;" +
            "font:600 13px sans-serif;cursor:pointer;box-sizing:border-box;" +
            (primary ? "background:#202632;color:#fff" : "background:#fff;color:#111"));
        button.type = "button";
        return button;
    }

    function openPanel(launcher) {
        if (document.getElementById(UI_ID)) return;
        const casts = getCasts();
        const overlay = element("div", null,
            "position:fixed;inset:0;z-index:2147483647;background:#0008;display:flex;" +
            "align-items:center;justify-content:center;padding:12px;box-sizing:border-box");
        overlay.id = UI_ID;
        const panel = element("div", null,
            "width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:14px;" +
            "box-sizing:border-box;background:#fff;color:#111;border-radius:10px;font:14px/1.5 sans-serif");
        panel.setAttribute("role", "dialog");
        panel.setAttribute("aria-modal", "true");
        panel.setAttribute("aria-labelledby", "wlw_cast_select_title");
        panel.tabIndex = -1;
        const title = element("div", "キャスト選択", "font-size:18px;font-weight:700;margin-bottom:6px");
        title.id = "wlw_cast_select_title";
        const help = element("div", "表示したいキャストにチェックを入れ、OKで反映します。", "margin-bottom:10px");
        const toolbar = element("div", null, "display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px;margin-bottom:10px");
        const toggleAll = makeButton("全選択", false);
        toolbar.append(toggleAll);
        const status = element("div", "", "margin:6px 0;font-size:13px");
        status.setAttribute("role", "status");
        const message = element("div", "", "color:#b42318;font-size:13px;white-space:pre-line");
        message.setAttribute("role", "status");
        const list = element("div", null,
            "max-height:38vh;overflow:auto;overscroll-behavior:contain;border:1px solid #ddd;border-radius:6px");
        const boxes = new Map();
        const labels = new Map();
        let visibleCasts = casts;

        for (const cast of casts) {
            const label = element("label", null,
                "display:flex;align-items:center;gap:10px;padding:9px 10px;min-height:44px;" +
                "box-sizing:border-box;border-bottom:1px solid #eee;cursor:pointer;color:#111;background:#fff");
            label.className = "wlw-cast-row";
            const input = element("input");
            input.type = "checkbox";
            input.value = cast.id;
            input.checked = selectedIds.has(cast.id);
            input.style.cssText = "appearance:auto;-webkit-appearance:checkbox;position:static;opacity:1;width:20px;height:20px;margin:0;flex-shrink:0";
            input.setAttribute("aria-label", cast.name);
            const text = element("span", null, "min-width:0;overflow-wrap:anywhere");
            const name = element("span", cast.name, "display:block;font-weight:600");
            const detail = element("span", cast.wins + "勝 ／ CR" + (cast.rank ?? "[不明]"), "display:block;font-size:12px;color:#555");
            text.append(name, detail);
            label.append(input, text);
            list.appendChild(label);
            boxes.set(cast.id, input);
            labels.set(cast.id, label);
            input.addEventListener("change", updateCount);
        }

        function updateCount() {
            const count = visibleCasts.filter(cast => boxes.get(cast.id).checked).length;
            status.textContent = count + " / " + visibleCasts.length + "キャストを選択";
            toggleAll.textContent = visibleCasts.length > 0 && count === visibleCasts.length ? "全解除" : "全選択";
            toggleAll.disabled = visibleCasts.length === 0;
        }

        function selectWhere(predicate) {
            for (const cast of visibleCasts) boxes.get(cast.id).checked = predicate(cast);
            message.textContent = "";
            updateCount();
        }

        toggleAll.addEventListener("click", () => {
            const allSelected = visibleCasts.every(cast => boxes.get(cast.id).checked);
            selectWhere(() => !allSelected);
        });

        const rankSelect = element("select");
        rankSelect.setAttribute("aria-label", "キャストランクの下限");
        rankSelect.style.cssText = "width:100%;min-width:0;padding:7px 6px;box-sizing:border-box;border:1px solid #aaa;border-radius:6px;font:14px sans-serif;background:#fff;color:#111";
        for (const value of ["custom", "1", "10", "20", "30", "40"]) {
            const option = element("option", value === "custom" ? "カスタム" : value === "30" ? "EX00以上" : value === "40" ? "EX10以上" : "CR" + value + "以上");
            option.value = String(value);
            rankSelect.appendChild(option);
        }
        rankSelect.value = selectedRank;
        const roleSelect = element("select");
        roleSelect.setAttribute("aria-label", "キャストのロール");
        roleSelect.style.cssText = rankSelect.style.cssText;
        for (const [value, name] of [["all", "全ロール"], ["0", "ファイター"], ["1", "アタッカー"], ["2", "サポーター"]]) {
            const option = element("option", name);
            option.value = value;
            roleSelect.appendChild(option);
        }
        roleSelect.value = selectedRole;
        const filters = element("div", null, "display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px");
        filters.append(rankSelect, roleSelect);
        const empty = element("div", "", "padding:10px;font-size:13px");
        list.appendChild(empty);
        function filterList(resetSelection) {
            const custom = rankSelect.value === "custom";
            const minimumRank = Number(rankSelect.value);
            visibleCasts = casts.filter(cast =>
                (custom || (cast.rank !== null && cast.rank >= minimumRank)) &&
                (roleSelect.value === "all" || cast.role === roleSelect.value));
            empty.textContent = visibleCasts.length ? "" : "該当するキャストがありません";
            const visibleIds = new Set(visibleCasts.map(cast => cast.id));
            for (const cast of casts) {
                const visible = visibleIds.has(cast.id);
                if (visible) labels.get(cast.id).style.removeProperty("display");
                else labels.get(cast.id).style.setProperty("display", "none", "important");
                if (resetSelection) boxes.get(cast.id).checked = !custom && visible;
            }
            message.textContent = "";
            updateCount();
        }
        rankSelect.addEventListener("change", () => filterList(true));
        roleSelect.addEventListener("change", () => filterList(true));
        filterList(false);

        const note = element("div", "", "font-size:12px;color:#555;margin-top:8px");
        if (casts.some(cast => cast.role === null)) {
            note.textContent = "ロール未取得のキャストがあります。「全キャスト取得」を実行してください。";
        }
        const footer = element("div", null, "display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:-14px;padding:12px 0 0;background:#fff");
        const cancel = makeButton("キャンセル", false);
        const ok = makeButton("OK", true);
        footer.append(cancel, ok);
        ok.addEventListener("click", () => {
            selectedRank = rankSelect.value;
            selectedRole = roleSelect.value;
            selectedIds = new Set(visibleCasts.filter(cast => boxes.get(cast.id).checked).map(cast => cast.id));
            applySelection(casts);
            close();
        });
        cancel.addEventListener("click", close);
        overlay.addEventListener("click", event => { if (event.target === overlay) close(); });
        panel.addEventListener("keydown", event => {
            if (event.key === "Escape") { event.preventDefault(); close(); }
        });
        const oldOverflow = document.body.style.overflow;
        function close() {
            document.body.style.overflow = oldOverflow;
            overlay.remove();
            launcher.focus();
        }
        panel.append(title, help, toolbar, filters, message, status, list, note, footer);
        const styles = element("style", `
            #${UI_ID} .wlw-cast-row {
                display:flex!important;flex-direction:row!important;align-items:center!important;
                justify-content:flex-start!important;gap:10px!important;
                position:static!important;float:none!important;box-sizing:border-box!important;
                width:100%!important;max-width:none!important;height:auto!important;min-height:44px!important;
                margin:0!important;padding:9px 10px!important;border:0!important;
                background:#fff!important;box-shadow:none!important;text-align:left!important;
            }
            #${UI_ID} .wlw-cast-row span {
                display:block!important;position:static!important;float:none!important;
                width:auto!important;height:auto!important;min-width:0!important;
                margin:0!important;padding:0!important;border:0!important;
                background:none!important;box-shadow:none!important;text-align:left!important;
                line-height:1.5!important;white-space:normal!important;
            }
            #${UI_ID} .wlw-cast-row input[type="checkbox"] {
                appearance:auto!important;-webkit-appearance:checkbox!important;
                display:block!important;position:static!important;float:none!important;
                width:20px!important;height:20px!important;min-width:20px!important;
                margin:0!important;padding:0!important;flex:0 0 20px!important;
                opacity:1!important;transform:none!important;box-shadow:none!important;
            }
            #${UI_ID} .wlw-cast-row::before, #${UI_ID} .wlw-cast-row::after,
            #${UI_ID} .wlw-cast-row span::before, #${UI_ID} .wlw-cast-row span::after,
            #${UI_ID} .wlw-cast-row input::before, #${UI_ID} .wlw-cast-row input::after {
                content:none!important;display:none!important;
            }
        `);
        overlay.append(styles, panel);
        document.getElementById("wlw-role-demo").appendChild(overlay);

        updateCount();
        panel.focus();
    }
})();
document.getElementById("wlw_cast_select_button").click();
</script>
</body></html>
